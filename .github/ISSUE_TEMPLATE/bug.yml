name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This fork adds Spotify Free playback on macOS. If the problem also
        happens in [upstream Spotifast](https://github.com/crmne/spotifast/issues),
        report it there instead.

        Please include the log from Spotifast's last run:

        - macOS: `~/Library/Application\ Support/me.paolino.spotifast/spotifast.log`
        - Linux: `~/.local/state/spotifast/spotifast.log`
        - Windows: `%LOCALAPPDATA%\paolino\spotifast\data\spotifast.log`

        If the app crashed or vanished, include `panic.log` from the same folder.
  - type: input
    id: version
    attributes:
      label: Commit you built
      description: Run `git rev-parse --short HEAD` in your checkout.
      placeholder: "c428ef5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, or the OS version.
      placeholder: "macOS 15.6 / Arch, Hyprland, PipeWire / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Spotify plan
      options:
        - Free
        - Premium
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: spotifast.log
      description: Reproduce the problem, quit the app, then paste the whole file here (and panic.log, if there is one). Paths are above.
      render: text
    validations:
      required: true
